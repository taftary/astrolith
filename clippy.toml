# Clippy configuration. Test allowances pair with the panic-family denies in
# [workspace.lints.clippy]: tests may unwrap/expect, library code may not
# (E-NO-PANIC). Thresholds below are the project values, not defaults.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
too-many-lines-threshold = 300
cognitive-complexity-threshold = 40
allow-indexing-slicing-in-tests = true
allow-panic-in-tests = true
