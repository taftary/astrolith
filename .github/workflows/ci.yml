name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The Intake path guard diffs $BEFORE..$SHA and falls back to HEAD~1,
          # so it needs history. At the default depth of 1 neither exists and
          # the guard aborts with exit 128.
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Markdown lint
        run: |
          python3 <<'PYEOF'
          import pathlib
          import sys

          errors = []
          files = sorted(pathlib.Path(".").rglob("*.md"))
          if not files:
              print("No markdown files found.")
          for path in files:
              # Skip the .git directory.
              if ".git" in path.parts:
                  continue
              data = path.read_bytes()
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  errors.append(f"{path}: not valid UTF-8")
                  continue
              lines = text.splitlines(keepends=True)
              for i, line in enumerate(lines, start=1):
                  stripped = line.rstrip("\r\n")
                  if stripped != stripped.rstrip(" \t"):
                      errors.append(f"{path}:{i}: trailing whitespace")
                  leading = stripped[: len(stripped) - len(stripped.lstrip(" \t"))]
                  if "\t" in leading:
                      errors.append(f"{path}:{i}: tab indentation")
              if not data.endswith(b"\n"):
                  errors.append(f"{path}: missing single trailing newline")
              elif data.endswith(b"\n\n"):
                  errors.append(f"{path}: more than one trailing newline")

          if errors:
              print("Markdown lint failures:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print(f"Markdown lint passed ({len(files)} file(s)).")
          PYEOF

      - name: Workflow files check
        run: |
          python3 <<'PYEOF'
          import pathlib
          import re
          import sys

          EXPECTED_SKILLS = [
              "clarification",
              "specification",
              "testability-preflight",
              "planning",
              "tasks",
              "implementation",
              "pull-request",
              "technical-validation",
              "visual-validation",
              "correction",
              "present-for-owner-testing",
              "wait-checks",
          ]

          errors = []

          if not pathlib.Path("AGENTS.md").is_file():
              errors.append("AGENTS.md is missing at the repository root")

          def has_description(path: pathlib.Path) -> bool:
              try:
                  text = path.read_text(encoding="utf-8")
              except OSError as exc:
                  errors.append(f"{path}: cannot read file ({exc})")
                  return False
              if not text.startswith("---\n") and not text.startswith("---\r\n"):
                  return False
              lines = text.splitlines()
              end = None
              for i in range(1, len(lines)):
                  if lines[i].strip() == "---":
                      end = i
                      break
              if end is None:
                  return False
              frontmatter = "\n".join(lines[1:end])
              return re.search(r"^description\s*:", frontmatter, re.MULTILINE) is not None

          agent_files = sorted(pathlib.Path(".opencode/agents").glob("*.md")) if pathlib.Path(".opencode/agents").is_dir() else []
          if not pathlib.Path(".opencode/agents").is_dir():
              errors.append(".opencode/agents/ directory is missing")
          if not agent_files:
              errors.append("no agent files found in .opencode/agents/*.md")
          for path in agent_files:
              if not has_description(path):
                  errors.append(f"{path}: missing frontmatter description")

          skill_dirs = sorted(p for p in pathlib.Path(".opencode/skills").iterdir() if p.is_dir()) if pathlib.Path(".opencode/skills").is_dir() else []
          found_ids = sorted(p.name for p in skill_dirs)
          if found_ids != sorted(EXPECTED_SKILLS):
              errors.append(
                  f"skill IDs must be exactly {sorted(EXPECTED_SKILLS)}; found {found_ids}"
              )
          for skill_id in EXPECTED_SKILLS:
              skill_file = pathlib.Path(f".opencode/skills/{skill_id}/SKILL.md")
              if not skill_file.is_file():
                  errors.append(f"{skill_file} is missing")
              elif not has_description(skill_file):
                  errors.append(f"{skill_file}: missing frontmatter description")

          if errors:
              print("Workflow files check failures:")
              for e in errors:
                  print(f"  {e}")
              sys.exit(1)
          print("Workflow files check passed.")
          PYEOF

      - name: Branch name guard
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          echo "Head ref: $HEAD_REF"
          if ! printf '%s' "$HEAD_REF" | grep -Eq '^((feat|fix)/[0-9]+-[a-z0-9-]+|chore/[a-z0-9-]+|dependabot/.*)$'; then
            echo "Branch name '$HEAD_REF' must match ^((feat|fix)/[0-9]+-[a-z0-9-]+|chore/[a-z0-9-]+|dependabot/.*)$"
            exit 1
          fi
          echo "Branch name OK."

      - name: Validator pass link guard
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          python3 <<'PYEOF'
          import os
          import re
          import sys

          body = os.environ.get("PR_BODY") or ""
          head = os.environ.get("HEAD_SHA") or ""
          if os.environ.get("PR_AUTHOR") == "dependabot[bot]":
              print("Dependabot maintenance PR; treated as no parent Issue.")
              sys.exit(0)
          if re.search(r"no parent Issue", body, re.IGNORECASE):
              print("No-parent-Issue maintenance PR; no validator pass expected.")
              sys.exit(0)
          problems = []
          if not re.search(r"https?://\S*issues/\d+#issuecomment-\d+", body):
              problems.append("no validator verdict link (fill the Validator pass section)")
          m = re.search(r"\b[0-9a-f]{40}\b", body)
          if not m:
              problems.append("no full 40-hex commit SHA (fill the Validator pass section)")
          elif m.group(0) != head:
              problems.append(f"linked SHA {m.group(0)} != PR head SHA {head} (stale pass)")
          if problems:
              print("Validator pass link guard failures:")
              for p in problems:
                  print(f"  {p}")
              sys.exit(1)
          print(f"Validator pass link OK (SHA matches head {head}).")
          PYEOF

      - name: Doc drift guard
        run: python3 scripts/gates/doc_drift_gate.py

      - name: Intake path guard
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          msg=$(git log -1 --pretty=%B)
          if printf '%s' "$msg" | grep -Eq '\(#[0-9]+\)\s*$'; then
            echo "PR merge commit; intake path guard skipped."
            exit 0
          fi
          git diff --name-only "$BEFORE" "$SHA" > /tmp/push_files.txt || git diff --name-only HEAD~1 HEAD > /tmp/push_files.txt
          python3 <<'PYEOF'
          import pathlib
          import sys

          allowed = ("drafts/", "docs/workflow.md", ".agent/")
          bad = [l for l in pathlib.Path("/tmp/push_files.txt").read_text().splitlines()
                 if l and not l.startswith(allowed)]
          if bad:
              print("Intake path guard failures (direct push to main may touch only drafts/, docs/workflow.md, .agent/):")
              for b in bad:
                  print(f"  {b}")
              sys.exit(1)
          print("Intake path guard passed.")
          PYEOF

      # Ungated on purpose. The guard above is `if: push`, so on a pull request
      # it is skipped and proves nothing; on a squash merge it exits 0 before
      # reaching the diff. This step is the only thing that can show the guard
      # actually works, so it must run on every pull request.
      - name: Intake path guard self-test
        run: |
          python3 <<'PYEOF'
          import pathlib
          import re
          import subprocess
          import sys

          wf = pathlib.Path(".github/workflows/ci.yml")
          if not wf.is_file():
              print("self-test FAIL: workflow file not found")
              sys.exit(1)
          text = wf.read_text()

          # 1. The guard body must still be intact, or this test tests nothing.
          required = [
              "name: Intake path guard",
              "if: github.event_name == 'push'",
              "PR merge commit; intake path guard skipped.",
              "sys.exit(1)",
              "Intake path guard passed.",
          ]
          missing = [r for r in required if r not in text]
          if missing:
              print("self-test FAIL: guard body altered, missing:")
              for m in missing:
                  print(f"  {m}")
              sys.exit(1)

          # 2. Take the allowed tuple from the guard itself, never from a copy,
          #    so narrowing or widening the guard is followed by this test
          #    instead of being silently passed over.
          m = re.search(r"allowed\s*=\s*\(([^)]*)\)", text)
          if not m:
              print("self-test FAIL: no allowed tuple found in the guard body")
              sys.exit(1)
          allowed = tuple(re.findall(r'"([^"]+)"', m.group(1)))
          if not allowed:
              print("self-test FAIL: allowed tuple parsed empty")
              sys.exit(1)
          print(f"self-test: guard body intact; allowed tuple = {allowed}")

          # 3. The checkout must resolve a parent commit. This is the clause
          #    that fails at the default fetch-depth of 1.
          p = subprocess.run(["git", "rev-parse", "--verify", "HEAD~1"],
                             capture_output=True, text=True)
          if p.returncode != 0:
              print("self-test FAIL: cannot resolve HEAD~1, so the guard "
                    "cannot diff a push; checkout history is too shallow: "
                    f"{p.stderr.strip()}")
              sys.exit(1)
          print(f"self-test: parent resolved = {p.stdout.strip()}")

          # 4. The guard's own predicate over an allowed-only push: must pass.
          def bad_list(lines):
              return [l for l in lines if l and not l.startswith(allowed)]

          ok_push = ["drafts/some-notion.md", "docs/workflow.md",
                     ".agent/project-config.json"]
          bad = bad_list(ok_push)
          if bad:
              print(f"self-test FAIL: an allowed push was rejected: {bad}")
              sys.exit(1)
          print(f"self-test: allowed path passed ({len(ok_push)} files)")

          # 5. The same predicate over a push touching anything else: must fail.
          bad_push = ["crates/universe-core/src/lib.rs"]
          bad = bad_list(bad_push)
          if not bad:
              print("self-test FAIL: a forbidden path was accepted")
              sys.exit(1)
          print(f"self-test: forbidden path rejected ({len(bad)} bad)")

          print("SELFTEST-OK")
          PYEOF

      - name: Parent auto-close guard
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          API_URL: ${{ github.api_url }}
        run: |
          python3 <<'PYEOF'
          import json
          import os
          import re
          import sys
          import urllib.request

          body = os.environ.get("PR_BODY") or ""
          repo = os.environ.get("GITHUB_REPOSITORY", "")
          api_url = os.environ.get("API_URL") or "https://api.github.com"
          token = os.environ.get("GITHUB_TOKEN", "")

          pattern = re.compile(
              r"\b(?:close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved)\s*:?\s*#(\d+)",
              re.IGNORECASE,
          )
          refs = pattern.findall(body)
          if not refs:
              print("No auto-close keywords found; parent auto-close guard passed.")
              sys.exit(0)

          if not token:
              print("GITHUB_TOKEN is missing; cannot verify referenced issue labels.")
              sys.exit(1)
          if "/" not in repo:
              print(f"GITHUB_REPOSITORY is invalid: {repo!r}")
              sys.exit(1)

          failures = []
          for num in dict.fromkeys(refs):
              url = f"{api_url}/repos/{repo}/issues/{num}"
              req = urllib.request.Request(
                  url,
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "ci-parent-auto-close-guard",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      payload = json.load(resp)
              except Exception as exc:
                  failures.append(f"#{num}: could not fetch issue labels ({exc})")
                  continue
              labels = [l.get("name", "") for l in payload.get("labels", [])]
              if "task" not in labels:
                  failures.append(
                      f"#{num} is referenced by an auto-close keyword but lacks the `task` label "
                      f"(labels: {labels}); only sub-issues may use auto-close keywords"
                  )
              else:
                  print(f"#{num}: has `task` label, OK.")

          if failures:
              print("Parent auto-close guard failures:")
              for f in failures:
                  print(f"  {f}")
              sys.exit(1)
          print("Parent auto-close guard passed.")
          PYEOF

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libudev-dev libx11-dev libxkbcommon-dev libwayland-dev libasound2-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cargo check
        run: cargo check --locked --workspace

      - name: Cargo clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo doc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked

      - name: Dependency direction
        run: |
          ! cargo tree -p universe-core -e normal --locked | grep -E 'bevy|wgpu|winit'
          ! cargo tree -p universe-render -e normal --locked | grep -E 'universe-app'
          ! grep -rE 'universe_render::|bevy::' crates/universe-app/src/verify.rs crates/universe-app/src/capture.rs

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Cargo deny
        run: cargo deny check

      - name: Install typos
        run: cargo install typos-cli --locked

      - name: Typos
        run: typos

      - name: Cargo test
        run: cargo test --locked --workspace

      - name: Golden tests
        run: cargo test --locked -p universe-app --test golden

      - name: Doc tests
        run: cargo test --locked --workspace --doc

      - name: Output vocabulary
        run: |
          cargo run --locked -p universe-app -- --verify > /tmp/verify.txt
          test "$(tail -n 1 /tmp/verify.txt)" = "VERIFY-OK"
          python3 <<'PYEOF'
          import pathlib
          import sys

          sys.path.insert(0, "scripts/validation")
          from validate import ERROR_PAT, WARN_PAT

          lines = pathlib.Path("/tmp/verify.txt").read_text(encoding="utf-8").splitlines()
          bad = [l for l in lines if ERROR_PAT.search(l)]
          warns = [l for l in lines if WARN_PAT.search(l)]
          if bad or warns:
              print("Output vocabulary failures:")
              for l in bad + warns:
                  print(f"  {l[:200]}")
              sys.exit(1)
          print(f"Output vocabulary passed ({len(lines)} lines).")
          PYEOF

  ci-windows:
    runs-on: windows-latest
    env:
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: 1.97.1

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Cargo check
        run: cargo check --locked --workspace

      - name: Cargo test
        run: cargo test --locked --workspace
