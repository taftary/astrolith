[workspace]
resolver = "2"
members = [
    "crates/universe-core",
    "crates/universe-render",
    "crates/universe-app",
    "crates/universe-verify",
    "crates/engine-lab",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taftary/astrolith"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.dev]
opt-level = 1
# Line tables only: panics stay resolvable to file and line
# (RUST_BACKTRACE=1 in CI) without the full debuginfo footprint.
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# Dependencies (Bevy above all) carry no debuginfo: they are never the code
# being debugged here and they dominate every target dir. Measured on the dev
# PC after this change, a full workspace build including every test binary
# writes 2.43 GB, of which 0.30 GB is debug information. This moves no float
# result and no output byte; the golden tests prove it.
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = 1

[workspace.dependencies]
# Bevy 0.19.1 is the newest 0.19 patch release (stable, not 0.20-rc).
# Exact pin (=) so every build resolves identically; Cargo.lock records the tree.
# default-features = false: only the features listed here are enabled (see docs/universes/stack.md).
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_render",
    "bevy_state",
    "bevy_ui",
    # bevy_ui_render: draws UI nodes to the window; bevy_ui alone only runs
    # layout and interaction, leaving every button, readout, and label blank.
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    # default_font: embedded text font; without it every Text node renders blank.
    "default_font",
    "multi_threaded",
    # png: encodes `--screens` window pictures as PNG files (#492, ADR 0021).
    "png",
    "std",
    "wayland",
    "x11",
] }
# bevy_egui 0.42 is the release for Bevy 0.19 (0.43 needs Bevy 0.20).
# Engine lab only (#640, ADR 0029); never a dependency of a game crate.
# render only: draws egui into the window. No default_fonts (their OFL and
# Ubuntu font licences are not on the deny allow-list): the lab installs
# the game's bundled Inter font (ADR 0023). Clipboard, URL opening and
# picking extras are left out.
bevy_egui = { version = "0.42", default-features = false, features = ["render"] }
universe-core = { path = "crates/universe-core" }
universe-render = { path = "crates/universe-render" }
