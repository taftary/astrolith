[workspace]
resolver = "2"
members = [
    "crates/universe-core",
    "crates/universe-render",
    "crates/universe-app",
    "crates/universe-verify",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
repository = "https://github.com/taftary/astrolith"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
indexing_slicing = "deny"
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
cast_precision_loss = "warn"
cast_possible_wrap = "warn"
cast_lossless = "warn"
must_use_candidate = "warn"
missing_errors_doc = "warn"
missing_panics_doc = "warn"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
panic = "unwind"

[profile.profiling]
inherits = "release"
debug = 1

[workspace.dependencies]
# Bevy 0.19.1 is the newest 0.19 patch release (stable, not 0.20-rc).
# Exact pin (=) so every build resolves identically; Cargo.lock records the tree.
# default-features = false: only the features listed here are enabled (see docs/universe/stack.md).
bevy = { version = "=0.19.1", default-features = false, features = [
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_gizmos",
    "bevy_gizmos_render",
    "bevy_image",
    "bevy_log",
    "bevy_mesh",
    "bevy_pbr",
    "bevy_render",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "std",
    "wayland",
    "x11",
] }
universe-core = { path = "crates/universe-core" }
universe-render = { path = "crates/universe-render" }
