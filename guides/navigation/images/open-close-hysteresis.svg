<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>Open and close hysteresis on the angular-radius axis</title>
  <desc>Astrolith gates: preview at 0.02 rad, close at 0.10 rad, open at 0.14 rad. The marker shell brightness falls from 1 to a 0.15 floor over 0.02 to 0.14 rad while the children brightness rises from 0 to 1. Between 0.10 and 0.14 rad the open state is retained (hysteresis band).</desc>
  <rect x="0" y="0" width="800" height="420" fill="#ffffff"/>
  <!-- hysteresis band -->
  <rect x="400" y="60" width="128" height="300" fill="#fff3c4"/>
  <text x="464" y="52" text-anchor="middle" fill="#8a6d00">hysteresis band (ratio 1.4)</text>
  <!-- plot axes -->
  <line x1="80" y1="260" x2="740" y2="260" stroke="#333" stroke-width="1.5"/>
  <line x1="80" y1="60" x2="80" y2="260" stroke="#333" stroke-width="1.5"/>
  <text x="60" y="64" text-anchor="end">1.0</text>
  <text x="60" y="264" text-anchor="end">0.0</text>
  <text x="30" y="170" text-anchor="middle" transform="rotate(-90 30 170)">brightness</text>
  <!-- threshold lines -->
  <line x1="144" y1="60" x2="144" y2="360" stroke="#888" stroke-dasharray="4 3"/>
  <line x1="400" y1="60" x2="400" y2="360" stroke="#1f77b4" stroke-dasharray="4 3"/>
  <line x1="528" y1="60" x2="528" y2="360" stroke="#d62728" stroke-dasharray="4 3"/>
  <!-- curves: children (rising) and shell (falling) -->
  <path d="M 80 260 L 144 260 C 200 260 220 228.8 240 228.8 C 300 180 320 160 336 160 C 380 110 400 91.2 432 91.2 C 480 70 500 60 528 60 L 740 60" fill="none" stroke="#2ca02c" stroke-width="2.5"/>
  <path d="M 80 60 L 144 60 C 200 60 220 86.6 240 86.6 C 300 130 320 145 336 145 C 380 190 400 203.4 432 203.4 C 480 222 500 230 528 230 L 740 231" fill="none" stroke="#ff7f0e" stroke-width="2.5"/>
  <text x="600" y="50" fill="#2ca02c">children brightness</text>
  <text x="600" y="248" fill="#ff7f0e">marker shell brightness (floor 0.15)</text>
  <!-- axis ticks -->
  <text x="144" y="280" text-anchor="middle">0.02</text>
  <text x="400" y="280" text-anchor="middle" fill="#1f77b4">0.10</text>
  <text x="528" y="280" text-anchor="middle" fill="#d62728">0.14</text>
  <text x="740" y="280" text-anchor="middle">0.20</text>
  <text x="410" y="300" text-anchor="middle">angular radius of the marker (rad)</text>
  <!-- state row -->
  <rect x="80" y="318" width="448" height="34" fill="#e8eef7" stroke="#9fb3d1"/>
  <text x="240" y="340" text-anchor="middle" fill="#1f3b63">closed: marker previews its interior above 0.02 rad</text>
  <rect x="528" y="318" width="212" height="34" fill="#fde2e2" stroke="#d99"/>
  <text x="634" y="340" text-anchor="middle" fill="#7a1f1f">open: camera is inside the cell</text>
  <!-- transition arrows -->
  <line x1="470" y1="372" x2="560" y2="372" stroke="#d62728" stroke-width="2"/>
  <polygon points="560,372 550,367 550,377" fill="#d62728"/>
  <text x="560" y="392" text-anchor="middle" fill="#d62728">open at 0.14 rad (7.2 radii)</text>
  <line x1="458" y1="372" x2="368" y2="372" stroke="#1f77b4" stroke-width="2"/>
  <polygon points="368,372 378,367 378,377" fill="#1f77b4"/>
  <text x="355" y="392" text-anchor="middle" fill="#1f77b4">close at 0.10 rad (10.0 radii)</text>
</svg>
