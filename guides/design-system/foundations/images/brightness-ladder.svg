<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="title desc">
<title id="title">Brightness ladder</title>
<desc id="desc">Three horizontal bands: shell brightest crossing the bloom threshold, children near it, context floor faint below.</desc>
<rect x="0" y="0" width="560" height="220" fill="#000000"/>
<line x1="40" y1="90" x2="520" y2="90" stroke="#ffffff" stroke-width="1" stroke-dasharray="6 4"/>
<text x="525" y="86" fill="#aaaaaa" font-family="sans-serif" font-size="11">bloom threshold</text>
<rect x="60" y="30" width="440" height="44" rx="8" fill="#fff2cc"/>
<text x="80" y="57" fill="#000000" font-family="sans-serif" font-size="13">shell: open cell, crosses threshold, blooms</text>
<rect x="60" y="96" width="440" height="40" rx="8" fill="none" stroke="#ffcc66" stroke-width="2"/>
<text x="80" y="121" fill="#ffcc66" font-family="sans-serif" font-size="13">children: portals and population, near threshold</text>
<rect x="60" y="152" width="440" height="36" rx="8" fill="none" stroke="#555555" stroke-width="1.5"/>
<text x="80" y="175" fill="#888888" font-family="sans-serif" font-size="13">context floor: kept parent, faint, 2+ stops below</text>
</svg>
