<svg xmlns="http://www.w3.org/2000/svg" width="320" height="560" viewBox="0 0 320 560" role="img" aria-labelledby="title desc">
<title id="title">Touch zones</title>
<desc id="desc">Phone with top status zone, middle meter zone, bottom thumb arc, and hatched system-gesture edges.</desc>
<rect x="0" y="0" width="320" height="560" fill="#000000"/>
<rect x="10" y="10" width="300" height="540" rx="24" fill="none" stroke="#333333" stroke-width="2"/>
<rect x="24" y="34" width="272" height="492" rx="8" fill="none" stroke="#555555" stroke-width="1" stroke-dasharray="5 4"/>
<rect x="24" y="34" width="272" height="90" fill="#10202a"/>
<text x="160" y="70" text-anchor="middle" fill="#9adcff" font-family="sans-serif" font-size="12">status: read-only top</text>
<text x="160" y="88" text-anchor="middle" fill="#9adcff" font-family="sans-serif" font-size="11">level, scale, distance</text>
<rect x="24" y="124" width="272" height="80" fill="#0f2318"/>
<text x="160" y="158" text-anchor="middle" fill="#8fe3ae" font-family="sans-serif" font-size="12">meters: compact</text>
<text x="160" y="176" text-anchor="middle" fill="#8fe3ae" font-family="sans-serif" font-size="11">icon + number + bar</text>
<path d="M 40 500 A 130 130 0 0 1 280 500 L 280 526 L 40 526 Z" fill="none" stroke="#66ff99" stroke-width="2"/>
<text x="160" y="505" text-anchor="middle" fill="#66ff99" font-family="sans-serif" font-size="12">thumb arc: input</text>
<rect x="24" y="500" width="272" height="26" fill="#331111"/>
<text x="160" y="517" text-anchor="middle" fill="#ff9999" font-family="sans-serif" font-size="10">system-gesture edge: keep clear</text>
</svg>
