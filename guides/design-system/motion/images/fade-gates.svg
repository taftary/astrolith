<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-labelledby="title desc">
<title id="title">Fade gates</title>
<desc id="desc">Angular-size axis with dot, form, preview, and open thresholds, each with a hysteresis band.</desc>
<rect x="0" y="0" width="560" height="170" fill="#000000"/>
<line x1="40" y1="90" x2="520" y2="90" stroke="#555555" stroke-width="2"/>
<text x="40" y="120" fill="#888888" font-family="sans-serif" font-size="11">small</text>
<text x="490" y="120" fill="#888888" font-family="sans-serif" font-size="11">large</text>
<g>
<rect x="110" y="70" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#4dc3ff" stroke-width="1.5"/>
<text x="133" y="140" text-anchor="middle" fill="#aaaaaa" font-family="sans-serif" font-size="11">form</text>
</g>
<g>
<rect x="230" y="70" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#ffcc66" stroke-width="1.5"/>
<text x="253" y="140" text-anchor="middle" fill="#aaaaaa" font-family="sans-serif" font-size="11">preview</text>
</g>
<g>
<rect x="350" y="70" width="46" height="40" rx="4" fill="#1a1a1a" stroke="#66ff99" stroke-width="1.5"/>
<text x="373" y="140" text-anchor="middle" fill="#aaaaaa" font-family="sans-serif" font-size="11">open</text>
</g>
<text x="80" y="60" fill="#888888" font-family="sans-serif" font-size="11">dot</text>
<text x="133" y="60" fill="#4dc3ff" font-family="sans-serif" font-size="11">enter/exit</text>
<text x="253" y="60" fill="#ffcc66" font-family="sans-serif" font-size="11">enter/exit</text>
<text x="373" y="60" fill="#66ff99" font-family="sans-serif" font-size="11">enter/exit</text>
</svg>
