<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-labelledby="title desc">
<title id="title">Reference map</title>
<desc id="desc">Four references and mobile patterns feeding Astrolith with labelled takes.</desc>
<rect x="0" y="0" width="560" height="220" fill="#000000"/>
<rect x="270" y="85" width="120" height="50" rx="10" fill="none" stroke="#ffffff" stroke-width="2"/>
<text x="330" y="105" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-size="13">Astrolith</text>
<text x="330" y="121" text-anchor="middle" fill="#aaaaaa" font-family="sans-serif" font-size="10">glow + silhouette</text>
<rect x="30" y="20" width="150" height="44" rx="8" fill="none" stroke="#4dc3ff" stroke-width="1.5"/>
<text x="105" y="38" text-anchor="middle" fill="#4dc3ff" font-family="sans-serif" font-size="12">Powers of Ten</text>
<text x="105" y="53" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">narration, not pacing</text>
<rect x="380" y="20" width="150" height="44" rx="8" fill="none" stroke="#4dc3ff" stroke-width="1.5"/>
<text x="455" y="38" text-anchor="middle" fill="#4dc3ff" font-family="sans-serif" font-size="12">Out There</text>
<text x="455" y="53" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">tension, not brutality</text>
<rect x="30" y="156" width="150" height="44" rx="8" fill="none" stroke="#4dc3ff" stroke-width="1.5"/>
<text x="105" y="174" text-anchor="middle" fill="#4dc3ff" font-family="sans-serif" font-size="12">Kingdom 2 Crowns</text>
<text x="105" y="189" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">restraint, not the loop</text>
<rect x="380" y="156" width="150" height="44" rx="8" fill="none" stroke="#4dc3ff" stroke-width="1.5"/>
<text x="455" y="174" text-anchor="middle" fill="#4dc3ff" font-family="sans-serif" font-size="12">FTL</text>
<text x="455" y="189" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">systems, not panels</text>
<rect x="200" y="156" width="160" height="44" rx="8" fill="none" stroke="#ffb000" stroke-width="1.5"/>
<text x="280" y="174" text-anchor="middle" fill="#ffb000" font-family="sans-serif" font-size="12">mobile patterns</text>
<text x="280" y="189" text-anchor="middle" fill="#888888" font-family="sans-serif" font-size="10">reach + safe area</text>
<line x1="180" y1="42" x2="270" y2="95" stroke="#555555" stroke-width="1.5"/>
<line x1="380" y1="42" x2="390" y2="95" stroke="#555555" stroke-width="1.5"/>
<line x1="180" y1="178" x2="270" y2="120" stroke="#555555" stroke-width="1.5"/>
<line x1="380" y1="178" x2="390" y2="120" stroke="#555555" stroke-width="1.5"/>
<line x1="330" y1="156" x2="330" y2="135" stroke="#555555" stroke-width="1.5"/>
</svg>
