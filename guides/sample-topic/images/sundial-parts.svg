<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 320" role="img" aria-labelledby="sundialTitle sundialDesc">
<title id="sundialTitle">Parts of a horizontal garden sundial</title>
<desc id="sundialDesc">A flat rectangular dial plate seen in perspective. A triangular gnomon stands near the top centre, its sloped upper edge labelled style. Hour lines fan out from the base of the gnomon across the plate, with the central noon line pointing down.</desc>
<!-- background -->
<rect x="0" y="0" width="420" height="320" fill="#ffffff"/>
<!-- dial plate -->
<polygon points="60,90 360,90 330,280 90,280" fill="#f4ecd8" stroke="#5b4a2f" stroke-width="3"/>
<text x="330" y="272" font-family="sans-serif" font-size="13" fill="#5b4a2f" text-anchor="end">dial plate</text>
<!-- hour lines fanning from gnomon base -->
<g stroke="#3a3a3a" stroke-width="1.5">
<line x1="210" y1="140" x2="110" y2="262"/>
<line x1="210" y1="140" x2="150" y2="268"/>
<line x1="210" y1="140" x2="185" y2="270"/>
<line x1="210" y1="140" x2="210" y2="272"/>
<line x1="210" y1="140" x2="235" y2="270"/>
<line x1="210" y1="140" x2="270" y2="268"/>
<line x1="210" y1="140" x2="308" y2="262"/>
</g>
<g font-family="sans-serif" font-size="12" fill="#3a3a3a" text-anchor="middle">
<text x="106" y="276">8</text>
<text x="148" y="280">9</text>
<text x="183" y="282">10</text>
<text x="210" y="286">12</text>
<text x="237" y="282">2</text>
<text x="271" y="280">4</text>
<text x="310" y="276">6</text>
</g>
<text x="222" y="270" font-family="sans-serif" font-size="13" fill="#3a3a3a">hour lines</text>
<text x="222" y="200" font-family="sans-serif" font-size="12" fill="#3a3a3a">noon line</text>
<!-- gnomon triangle -->
<polygon points="210,140 210,60 290,140" fill="#c9d4e0" stroke="#2f4a5b" stroke-width="3"/>
<line x1="210" y1="60" x2="290" y2="140" stroke="#b3392b" stroke-width="3"/>
<text x="296" y="100" font-family="sans-serif" font-size="13" fill="#2f4a5b">gnomon</text>
<text x="252" y="92" font-family="sans-serif" font-size="12" fill="#b3392b">style</text>
<!-- north arrow -->
<g stroke="#2f4a5b" stroke-width="2" fill="#2f4a5b">
<line x1="70" y1="60" x2="70" y2="30"/>
<polygon points="70,22 64,32 76,32"/>
</g>
<text x="70" y="72" font-family="sans-serif" font-size="12" fill="#2f4a5b" text-anchor="middle">N</text>
</svg>
