# Spell check configuration (typos). Default dictionary; this repository is
# Markdown-heavy and the owner reads the documents (E-TYPO). The words below
# are project vocabulary, each kept for a stated reason, never a typo.
[default.extend-words]
# Domain term: level of detail (terrain LOD selection, pre-existing code).
lod = "lod"
LOD = "LOD"
# Lattice coordinate names alongside `ix` (pre-existing noise/terrain code).
iy = "iy"
iz = "iz"
# Hex fragment of a commit SHA in docs/validator-capabilities.md.
ba = "ba"
# Substring of the frozen validator output regex in
# scripts/validation/validate.py (AC15: the check is never weakened).
deprecat = "deprecat"
# Pre-existing word in scripts/backfill/backfill.py (process tooling).
unparseable = "unparseable"
# Proper noun: Valles Marineris canyon system on Mars (L08 terrestrials doc).
Marineris = "Marineris"
# Proper noun: Lago Paranoa in Brasilia (L13 entry doc, NASA caption ASCII form).
Paranoa = "Paranoa"
# Domain term: cold/hot classical Kuiper Belt objects (L08 belts doc).
classicals = "classicals"
# Proper noun: MAK Vienna, Museum of Applied Arts (L14 storage doc).
MAK = "MAK"
# Proper noun: Johan Hidding, co-author of the caustic-skeleton formalism (L02 filaments doc).
Hidding = "Hidding"
# Proper noun: NASA Extragalactic Database (L04 ellipticals doc).
NED = "NED"
# Proper noun: George Smoot, Nobel laureate COBE (L01 background doc).
Smoot = "Smoot"
# Journal abbreviation: Communications Earth & Environment (L11 lifetime doc).
Commun = "Commun"
# Domain term: TESS Object of Interest, exoplanet candidate designation (L05 open, L09 companions docs).
TOI = "TOI"
# Proper noun: Zink et al., outer solar system dissolution study (L09 lifetime doc).
Zink = "Zink"
# Proper noun: American Concrete Institute, tilt-up guide (L13 industrial doc).
ACI = "ACI"
# Domain term: USGS Open-File Report series (L12 landscapes doc).
OFR = "OFR"
# Domain term: Extreme ultraviolet Imaging Telescope, SOHO instrument (L08 sun doc).
EIT = "EIT"
# Domain term: Howardite-Eucrite-Diogenite meteorite clan from Vesta (L08 belts doc).
HED = "HED"
# Name-generator syllables, never prose (core names.rs SYLLABLES, #446).
mor = "mor"
thi = "thi"
