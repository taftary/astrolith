# Dependency policy (E-DENY). Runs on every pull request and weekly
# (`audit.yml`). License additions beyond the notion's seven are recorded
# in docs/decisions/0008-*.md.
[graph]

[advisories]
version = 2
yanked = "deny"
unmaintained = "transitive"
ignore = [
    # Transitive through the pinned Bevy 0.19.1 tree; lifts with the next
    # Bevy ADR (E-DENY).
    { id = "RUSTSEC-2026-0192", reason = "transitive ttf-parser through pinned Bevy; lifts with the next Bevy ADR" },
    # bevy_egui 0.42 (planet lab only, ADR 0029) turns on bevy_image's
    # zstd_rust, which pins ruzstd 0.8; neither program decodes untrusted
    # .zst or KTX2 data. Lifts with the next Bevy ADR.
    { id = "RUSTSEC-2026-0344", reason = "ruzstd 0.8 through bevy_image zstd_rust, enabled by bevy_egui for the dev-only planet lab; no untrusted zstd input; lifts with the next Bevy ADR" },
]

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    # Added in M2 (#85) for the pinned tree, recorded in docs/decisions/0008:
    "MIT-0", # encase family, transitive through pinned Bevy, OSI approved
    "CC0-1.0", # hexf-parse via naga, transitive through pinned Bevy, FSF free
]

[bans]
multiple-versions = "warn"
# The engine facade is banned except as a direct dependency of the
# wrapper crates (the game's render and app, and the dev-only planet lab,
# ADR 0029), so universe-core (or any future crate) can never link it
# (E-DEPS-DIRECTION, E-CORE-NO-BEVY).
deny = [
    { crate = "bevy", wrappers = ["universe-render", "universe-app", "planet-lab"], reason = "engine facade, allowed only as a direct dependency of the render, app and planet-lab wrappers" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
